name: sig-assets
on:
  push:
    paths:
      - .github/workflows/sig-assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: decode signature images
        run: |
          mkdir -p sig
          echo '' | base64 -d > sig/ns-logo.png
          echo '' | base64 -d > sig/hs-mini.png
          echo '' | base64 -d > sig/cs-mini.png
      - name: commit
        run: |
          git config user.name "sig-assets-bot"
          git config user.email "actions@github.com"
          git add sig
          git diff --cached --quiet || git commit -m "Add email signature image assets"
          git push

